<div id="supplier-aging-dashboard" class="sad-shell">
  <div class="sad-head"><div><h2>Supplier Aging</h2><p>Outstanding supplier balances by age</p></div><button id="sad-refresh" class="sad-btn"><i class="fa fa-refresh"></i> Refresh</button></div>
  <div class="sad-card sad-filters">
    <label>Company<select id="sad-company"><option value="">All Companies</option></select></label>
    <label>As On Date<input id="sad-as-on-date" type="date"></label>
    <label>Balance Type<select id="sad-balance-type"><option value="all">All Balances</option><option value="greater">Greater Than Zero</option><option value="less">Less Than Zero</option></select></label>
    <label>Supplier Group<select id="sad-supplier-group"><option value="">All Supplier Groups</option></select></label>
  </div>
  <div id="sad-error" class="sad-error"></div><div id="sad-loading" class="sad-loading"><span></span> Loading supplier balances…</div>
  <div class="sad-card"><div class="sad-card-head"><span>Supplier Balance &amp; Aging</span><span id="sad-summary"></span></div><div class="sad-table-wrap"><table class="sad-table" id="sad-table"></table></div></div>
</div>
